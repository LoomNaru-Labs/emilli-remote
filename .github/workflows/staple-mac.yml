# Finishes a signed Mac dmg from a "Build Apple apps" run once Apple's notary service
# has accepted it: downloads the dmg and its notary submission id from that run, asks
# Apple for the submission's status, and only when it is "Accepted" staples the ticket
# to the dmg, checks it and uploads it as emilli-remote-<version>-macos-arm64.
#
#   gh workflow run staple-mac.yml -R LoomNaru-Labs/emilli-remote -f run_id=<build run id>
#
# While Apple is still checking, the run fails with that status and staples nothing;
# start it again later.
name: Staple the notarised Mac dmg

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the Build Apple apps run that made the signed dmg"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  VERSION: "1.5.0"
  RETENTION_DAYS: 30

jobs:
  staple:
    name: Check the notarisation, staple and verify
    runs-on: macos-14
    steps:
      - name: Download the signed dmg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emilli-remote-${{ env.VERSION }}-macos-arm64-signed
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ./

      - name: Download the notary submission id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emilli-remote-${{ env.VERSION }}-macos-arm64-notary-submission
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ./

      - name: Check the submission with Apple, staple and verify
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="emilli-remote-${VERSION}-macos-arm64.dmg"
          SUBMISSION_ID="$(tr -d '[:space:]' < notary-submission-id.txt)"
          echo "Build run $BUILD_RUN_ID, notary submission $SUBMISSION_ID"
          shasum -a 256 "$DMG"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          NOTARY=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          xcrun notarytool info "$SUBMISSION_ID" "${NOTARY[@]}" --output-format json > "$RUNNER_TEMP/info.json"
          cat "$RUNNER_TEMP/info.json"; echo
          STATUS="$(plutil -extract status raw -o - "$RUNNER_TEMP/info.json")"
          if [ "$STATUS" = "In Progress" ]; then
            echo "::error::Apple is still checking submission $SUBMISSION_ID. Nothing was stapled; run this workflow again later."
            exit 1
          fi
          # Apple's log lists every file it checked and any problem it found.
          xcrun notarytool log "$SUBMISSION_ID" "${NOTARY[@]}"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Apple did not accept submission $SUBMISSION_ID (status: $STATUS); see its log above."
            exit 1
          fi
          xcrun stapler staple "$DMG"
          echo "Checks: the dmg, its stapled ticket, and the app inside it"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          xcrun stapler validate "$DMG"
          MOUNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" > /dev/null
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Emilli Remote.app"
          codesign -dvv "$MOUNT/Emilli Remote.app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|Runtime Version)'
          spctl --assess --type execute --verbose "$MOUNT/Emilli Remote.app"
          hdiutil detach "$MOUNT" > /dev/null
          shasum -a 256 "$DMG"

      - name: Upload the notarised dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emilli-remote-${{ env.VERSION }}-macos-arm64
          path: emilli-remote-${{ env.VERSION }}-macos-arm64.dmg
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
