# Builds and tests "Emilli Remote Setup" (windows-easy/), the next-next Windows installer that
# carries our build of RustDesk 1.5.3 (branch windows-153: Emilli Remote icon, no update
# check, "Emilli Remote" as the shown name) and points it at rd.emillis.net.
#
# build: take the installer that the windows-153 run RUSTDESK_RUN_ID built and check its
#        SHA-256 (it is unsigned, like the setup until signing exists), install a
#        pinned Inno Setup, compile the setup, sign it (only once the Artifact Signing
#        secrets exist; until then it stays unsigned) and keep it as an artifact.
# test:  on a fresh runner, run the setup silently as a store PC and then as a controller,
#        check the service, the settings files, the store PC password and --get-id after
#        each, and uninstall between the runs. rd.emillis.net is blocked in the runner's
#        hosts file, so the test never registers a device on our server.
name: Build Windows setup

on:
  workflow_dispatch:
  push:
    branches: [easy-windows-153, easy3-setup]
    paths:
      - "windows-easy/**"
      - ".github/workflows/build-windows-easy.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-easy-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.5.3"
  # Branch easy3-windows, workflow build-windows-emilli.yml, run 43591806846 (commit d52f1d5).
  RUSTDESK_RUN_ID: "43591806846"
  RUSTDESK_ARTIFACT: emilli-rustdesk-1.5.3-windows-x86_64-unsigned
  RUSTDESK_SHA256: ea6eeb6a38eb07ab11bc43b1f8b34ef8d398a16c73f8d08558da5bef0092e700
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
  PYNACL_VERSION: "1.5.0"
  RETENTION_DAYS: 30

jobs:
  build:
    name: Build the setup
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # "true" only once the signing secrets are set in this repository.
      SIGNING_ENABLED: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT != '' && secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout the setup sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: windows-easy
          persist-credentials: false

      - name: Download our RustDesk build (branch windows-153)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RUSTDESK_ARTIFACT }}
          path: ${{ runner.temp }}/rustdesk
          run-id: ${{ env.RUSTDESK_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Check the RustDesk installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rustdesk'
          $exe = Join-Path $dir "rustdesk-$env:VERSION-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Write-Host "SHA-256 $hash"
          if ($hash -ne $env:RUSTDESK_SHA256) { throw "RustDesk installer SHA-256 mismatch" }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Signature $($sig.Status) (our own build, unsigned until signing exists)"
          "RUSTDESK_DIR=$dir" >> $env:GITHUB_ENV

      - name: Install Inno Setup 6.7.4 (pinned)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup installer SHA-256 mismatch" }
          $sig = Get-AuthenticodeSignature $installer
          Write-Host "Inno Setup signature $($sig.Status), signer $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Inno Setup installer is not validly signed" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw "ISCC.exe not found" }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Compile the setup
        shell: pwsh
        run: |
          & $env:ISCC "/DProgramDir=$env:RUSTDESK_DIR" "/DProgramSha256=$env:RUSTDESK_SHA256" "/O$env:GITHUB_WORKSPACE\out" windows-easy\EmilliRemoteSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem out | Format-Table Name, Length

      - name: "[signing] Sign the setup with Artifact Signing"
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\Emilli-Remote-Setup-${{ env.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Emilli Remote Setup

      - name: Show the signature state and the hash
        shell: pwsh
        run: |
          $setup = "out\Emilli-Remote-Setup-$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Signing enabled: $env:SIGNING_ENABLED; signature $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:SIGNING_ENABLED -eq 'true' -and $sig.Status -ne 'Valid') { throw "Signing was enabled but the setup is not validly signed" }
          Write-Host "SHA-256 $((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower())  $((Get-Item $setup).Length) bytes"

      - name: Upload the setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emilli-remote-setup-${{ env.VERSION }}-windows
          path: out/Emilli-Remote-Setup-${{ env.VERSION }}.exe
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error

  test:
    name: Install over the old name, check every name, uninstall
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # The unreleased REMOTE-153 Setup (easy-windows-153 5355124, run 43157166783): it installs
      # the program under the old name, as the plain download of the old guide did.
      OLD_SETUP_RUN_ID: "43157166783"
      OLD_SETUP_SHA256: ae4475951f0c50af0cc501ec7fa2fa97d5012da9f0b91750e59c2d57794a4a0b
    steps:
      - name: Checkout the test scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: windows-easy
          persist-credentials: false

      - name: Download the setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emilli-remote-setup-${{ env.VERSION }}-windows
          path: setup

      - name: Download the earlier Setup (old name)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emilli-remote-setup-1.5.3-windows
          path: oldsetup
          run-id: ${{ env.OLD_SETUP_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Prepare the runner
        shell: pwsh
        run: |
          # Keep the test away from our real server: no test device on rd.emillis.net.
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n127.0.0.1 rd.emillis.net`r`n::1 rd.emillis.net"
          ipconfig /flushdns | Out-Null
          $old = "oldsetup\Emilli-Remote-Setup-1.5.3.exe"
          $h = (Get-FileHash -Algorithm SHA256 $old).Hash.ToLower()
          if ($h -ne $env:OLD_SETUP_SHA256) { throw "not the earlier Setup ($h)" }
          Write-Host "Windows $([Environment]::OSVersion.VersionString); session $((Get-Process -Id $PID).SessionId); user $env:USERNAME"

      - name: Install, check, uninstall
        continue-on-error: true
        id: check
        shell: pwsh
        run: pwsh -NoProfile -File windows-easy\test-easy3-setup.ps1 -Setup "$env:GITHUB_WORKSPACE\setup\Emilli-Remote-Setup-$env:VERSION.exe" -OldSetup "$env:GITHUB_WORKSPACE\oldsetup\Emilli-Remote-Setup-1.5.3.exe" -Work "$env:RUNNER_TEMP\easy"

      - name: Keep the Setup logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emilli-remote-setup-test-logs
          path: |
            ${{ runner.temp }}/easy/*.log
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Verdict (the checks above write PASS and FAIL lines; the run stays green either way)
        if: always()
        shell: pwsh
        run: |
          Write-Host "Install, check, uninstall: ${{ steps.check.outcome }}"

  # REMOTE-EASY-3E: every place a person could still see the name of the software Emilli Remote is
  # built on, after an install: pictures of every page read by OCR, and the installed state
  # (windows-easy/names-check.ps1). "released" is the Setup on the download page since 2026-11-14
  # (run 43595051024), kept as the picture of "before"; "this-run" is the Setup built above.
  names:
    name: Where the old name shows (${{ matrix.which }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - which: released
            run_id: "43595051024"
            version: "1.5.3"
            mode: inventory
          - which: this-run
            run_id: ""
            version: ""
            mode: inventory
    env:
      PUBLIC_REPO: LoomNaru-Labs/emilli-remote
      CAPTURE_COMMIT: cde731dff4725554a14748413d61506ef97f2b0d
      MATRIX_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout the check script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: windows-easy
          persist-credentials: false

      - name: Which Setup
        shell: pwsh
        run: |
          $v = if ($env:MATRIX_VERSION) { $env:MATRIX_VERSION } else { $env:VERSION }
          "SETUP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Setup $v from run ${{ matrix.run_id || github.run_id }}"

      - name: Download the Setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emilli-remote-setup-${{ env.SETUP_VERSION }}-windows
          path: setup
          run-id: ${{ matrix.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Display 1920x1080 at 100 %, capture helpers, OCR (tesseract with Korean)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path capture | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:PUBLIC_REPO/$env:CAPTURE_COMMIT/session-capture/SessionLib.cs" -OutFile capture\SessionLib.cs
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:PUBLIC_REPO/$env:CAPTURE_COMMIT/windows-capture/capture-display.ps1" -OutFile capture\capture-display.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File capture\capture-display.ps1 -Width 1920 -Height 1080 -Scale 100
          choco install tesseract -y --no-progress | Select-Object -Last 3
          $tessdata = 'C:\Program Files\Tesseract-OCR\tessdata'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$tessdata\kor.traineddata"
          Write-Host "kor.traineddata SHA-256 $((Get-FileHash -Algorithm SHA256 "$tessdata\kor.traineddata").Hash.ToLower())"
          & 'C:\Program Files\Tesseract-OCR\tesseract.exe' --version 2>&1 | Select-Object -First 1

      - name: Install, picture every page, read the installed state
        id: names
        continue-on-error: ${{ matrix.mode == 'inventory' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-easy\names-check.ps1 -Setup "$env:GITHUB_WORKSPACE\setup\Emilli-Remote-Setup-$env:SETUP_VERSION.exe" -Lib "$env:GITHUB_WORKSPACE\capture\SessionLib.cs" -Out "$env:RUNNER_TEMP\names" -Mode ${{ matrix.mode }}

      - name: Keep the pictures and the list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emilli-remote-names-${{ matrix.which }}
          path: ${{ runner.temp }}/names
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Verdict
        if: always()
        shell: powershell
        run: |
          Write-Host "Where the old name shows (${{ matrix.which }}, ${{ matrix.mode }}): ${{ steps.names.outcome }}"
          $f = "$env:RUNNER_TEMP\names\found.txt"
          if (Test-Path $f) { Get-Content $f | Where-Object { $_ -like 'FOUND *' } | Measure-Object | ForEach-Object { Write-Host "FOUND lines: $($_.Count)" } }
