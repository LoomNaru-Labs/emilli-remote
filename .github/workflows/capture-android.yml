# Screenshots of the Android app "Emilli 원격" for the Emilli Remote manual.
#
# apk:     builds an x86_64 APK of this branch (build-android/capture/build-x86_64.sh) in the same
#          toolchain image as the Play build, signed with a throwaway key made and deleted inside
#          the build. The APK is kept only in this workflow's cache (keyed on the source), never
#          uploaded as an artifact or a release; it is not the Play build.
# capture: installs it on an Android 14 emulator (Pixel 6 screen) in Korean and in English and
#          drives the app (build-android/capture/drive.py): first launch, the ID, every prompt the
#          app raises, Settings, the built-in server and the login screen. rd.emillis.net is
#          blocked on the runner, so the emulator never reaches our server.
# The screenshots are kept as artifacts for 3 days only.
name: Capture Android screens

on:
  workflow_dispatch:
  push:
    branches: [android-play]
    paths:
      - "build-android/capture/**"
      - ".github/workflows/capture-android.yml"

permissions:
  contents: read

concurrency:
  group: capture-android-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_IMAGE: emilli/rustdesk-android-toolchain:1.5.0
  APK_NAME: emilli-remote-capture-x86_64.apk
  SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
  RETENTION_DAYS: 3

jobs:
  apk:
    name: x86_64 APK for the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout this branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cache key from the source (not the workflow or the driver)
        id: key
        run: |
          sum=$(git ls-tree -r HEAD | grep -v -P '\t(\.github/|build-android/capture/drive\.py$)' | sha256sum | cut -c1-20)
          echo "key=capture-apk-x86_64-$sum" >> "$GITHUB_OUTPUT"
          echo "key capture-apk-x86_64-$sum"

      - name: Look for an APK of this source
        id: apk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Make room on the runner
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -a -f > /dev/null
          df -h /

      - name: Restore the vcpkg package cache
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/vcpkg-archives
          key: capture-vcpkg-x64-android-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: capture-vcpkg-x64-android-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}-

      - name: Build the toolchain image (same Dockerfile as the Play build)
        if: steps.apk.outputs.cache-hit != 'true'
        run: docker build -t "$TOOLCHAIN_IMAGE" build-android

      - name: Build the x86_64 APK
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/apk"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work/rustdesk" \
            -v "$GITHUB_WORKSPACE/build-android:/recipe:ro" \
            -v "$RUNNER_TEMP/cache:/work/cache" \
            -v "$RUNNER_TEMP/apk:/work/out" \
            -e CARGO_BUILD_JOBS=4 -e VCPKG_MAX_CONCURRENCY=4 \
            "$TOOLCHAIN_IMAGE" bash /recipe/capture/build-x86_64.sh all
          ls -la "$RUNNER_TEMP/apk"
          df -h /

      - name: Keep the vcpkg packages for the next build
        if: always() && steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/vcpkg-archives
          key: capture-vcpkg-x64-android-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}-${{ github.run_id }}

      - name: Keep the APK in this workflow's cache
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ steps.key.outputs.key }}

  capture:
    name: Screens (${{ matrix.locale }})
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        locale: [ko-KR, en-US]
    steps:
      - name: Checkout the driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: build-android/capture
          persist-credentials: false

      - name: Get the APK
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ needs.apk.outputs.key }}
          fail-on-cache-miss: true

      - name: Keep the emulator away from our server
        run: |
          echo "127.0.0.1 rd.emillis.net" | sudo tee -a /etc/hosts > /dev/null
          for ip in $(dig +short A rd.emillis.net @1.1.1.1 | grep -E '^[0-9.]+$'); do sudo iptables -I OUTPUT -d "$ip" -j REJECT; done
          for ip in $(dig +short AAAA rd.emillis.net @1.1.1.1 | grep ':'); do sudo ip6tables -I OUTPUT -d "$ip" -j REJECT; done
          sudo iptables -S OUTPUT | grep -c REJECT
          if curl -sS -m 10 -o /dev/null https://rd.emillis.net; then echo "rd.emillis.net still reachable"; exit 1; else echo "rd.emillis.net blocked"; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install the emulator and an Android 14 image
        run: |
          # Libraries the emulator loads even without a window or sound (missing on ubuntu-24.04).
          sudo apt-get update -q
          sudo apt-get install -y -q libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libgl1 libegl1 libxkbfile1 > /dev/null
          sudo apt-get install -y -q libasound2t64 > /dev/null 2>&1 || sudo apt-get install -y -q libasound2 > /dev/null
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          (yes || true) | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n capture -k "$SYSTEM_IMAGE" -d pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -version | head -n 1
          # System libraries qemu needs that are neither on the runner nor bundled with the emulator.
          missing=""
          for lib in $(ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | awk '/not found/ {print $1}'); do
            [ -n "$(find "$ANDROID_HOME/emulator" -name "$lib" -print -quit)" ] || missing="$missing $lib"
          done
          if [ -n "$missing" ]; then echo "missing system libraries:$missing"; exit 1; fi

      - name: Start the emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd capture -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -cores 3 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device; then tail -n 40 "$RUNNER_TEMP/emulator.log"; exit 1; fi
          echo "emulator up"

      - name: Drive the app and take the screenshots
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          python3 build-android/capture/drive.py --apk "$RUNNER_TEMP/apk/$APK_NAME" --out "$RUNNER_TEMP/shots" --locale ${{ matrix.locale }}

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-shots-${{ matrix.locale }}
          path: ${{ runner.temp }}/shots
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn
