# REMOTE-EASY-3E: version 1.5.4; no text, file or folder of the program names the base software
# (only About > Open-source notice and LICENCE.txt do, as the licence asks); see
# .github/scripts/visible-names.py and the names job of the Setup workflow (branch easy3-setup).
# Builds RustDesk 1.5.3 for Windows (x64) from this branch: upstream's code with the Emilli Remote
# icon, no update check against RustDesk's servers and "Emilli Remote" as the shown name (see
# NOTICE). The steps follow upstream's own Windows job at tag 1.5.3 (flutter-build.yml,
# build-for-windows-flutter, x86_64) with the same tool versions and pinned actions; only the
# signing, the MSI and the release upload are left out. The result is the same kind of file as
# the official installer: a self-extracting rustdesk-1.5.3-x86_64.exe that supports
# --silent-install, which Emilli Remote Setup (branch easy-windows-153) carries.
# It is unsigned. Tool versions for Windows x64 are the same in upstream 1.5.0 and 1.5.3.
name: Build Windows app (Emilli)

on:
  workflow_dispatch:
  push:
    branches: [windows-153, windows-153-ui, easy3-windows]
    paths-ignore:
      - "NOTICE"
      - ".github/README.md"

permissions:
  contents: read

concurrency:
  group: build-windows-emilli-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.5.4"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  TOPMOST_COMMIT: "ecd8d6a139eee76845ea66423fb739af450fda90"
  RETENTION_DAYS: 30

jobs:
  bridge:
    name: Generate the Flutter-Rust bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: No text of the program names the base software (REMOTE-EASY-3E; the notice excepted)
        run: python3 .github/scripts/visible-names.py

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # As upstream: Flutter 3.22.3 cannot resolve extended_text 14, so the bridge step uses 13.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Check the Dart files we changed (errors only, before the long Windows build)
        # Informational: the bridge job runs Flutter 3.22.3, the app builds with 3.24.5.
        continue-on-error: true
        run: |
          cd flutter
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/common/widgets/toolbar.dart lib/common/widgets/dialog.dart lib/desktop/pages/desktop_setting_page.dart lib/desktop/widgets/remote_toolbar.dart lib/desktop/pages/server_page.dart lib/mobile/pages/remote_page.dart lib/mobile/pages/settings_page.dart lib/common/widgets/emilli_account.dart lib/desktop/pages/connection_page.dart lib/models/peer_tab_model.dart lib/common.dart lib/desktop/widgets/tabbar_widget.dart lib/common/widgets/peer_card.dart lib/models/user_model.dart lib/models/group_model.dart lib/desktop/pages/install_page.dart lib/desktop/pages/desktop_home_page.dart lib/models/native_model.dart

      - name: Upload bridge files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          retention-days: 1
          if-no-files-found: error
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  topmost:
    name: RustDeskTempTopMostWindow (privacy mode helper, as upstream)
    runs-on: windows-2022
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build WindowInjection.dll at upstream's pinned commit
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ${{ env.TOPMOST_COMMIT }}
          # Emilli Remote (REMOTE-EASY-3E): the privacy window's title carries our name; the program
          # finds the window by this title (src/privacy_mode/win_topmost_window.rs).
          $files = @(Get-ChildItem -Recurse -File -Include *.cpp, *.h | Where-Object { (Get-Content -Raw $_.FullName) -match 'RustDeskPrivacyWindow' })
          if ($files.Count -eq 0) { throw 'privacy window title not found in the helper source' }
          foreach ($f in $files) { (Get-Content -Raw $f.FullName) -replace 'RustDeskPrivacyWindow', 'EmilliPrivacyWindow' | Set-Content -NoNewline $f.FullName; Write-Host "title renamed in $($f.Name)" }
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Keep WindowInjection.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmostwindow-artifacts-x64
          retention-days: 1
          if-no-files-found: error
          path: ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  windows:
    name: Windows app (x64)
    needs: [bridge, topmost]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine (as upstream)
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Write-Host "engine zip SHA-256 $((Get-FileHash -Algorithm SHA256 windows-x64-release.zip).Hash.ToLower())"
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Emilli Remote: the program file carries the internal app name, as the installer expects
          # (it installs "<app name>.exe"; RustDesk custom clients are renamed the same way).
          Rename-Item ./rustdesk/rustdesk.exe EmilliRemote.exe

          # As upstream: the virtual display driver files.
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Write-Host "usbmmidd_v2.zip SHA-256 $((Get-FileHash -Algorithm SHA256 usbmmidd_v2.zip).Hash.ToLower())"
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Emilli Remote (REMOTE-EASY-3E): no printer driver. Upstream's remote printer driver is
          # signed under the base software's name ("RustDesk v4 Printer Driver", folder
          # drivers/RustDeskPrinterDriver), so it is not shipped and the Printer page is hidden.

          # The licence file in the program folder: the open-source notice, then the AGPL-3.0 text.
          $notice = [IO.File]::ReadAllText("$PWD\res\emilli-open-source-notice.txt")
          $licence = [IO.File]::ReadAllText("$PWD\LICENCE")
          $text = ($notice + $licence) -replace "`r`n", "`n" -replace "`n", "`r`n"
          [IO.File]::WriteAllText("$PWD\rustdesk\LICENCE.txt", $text, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "LICENCE.txt $((Get-Item .\rustdesk\LICENCE.txt).Length) bytes"

      - name: Find Runner.res
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ "$runner_res" == "" ]; then echo "Runner.res: not found"; else cp $runner_res ./libs/portable/Runner.res; ls -l ./libs/portable/Runner.res; fi

      - name: Add WindowInjection.dll
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Check the Emilli icon, name and update switch in the built app
        shell: bash
        run: |
          python - <<'PY'
          import struct, sys
          def ico_images(path):
              b = open(path, "rb").read()
              n = struct.unpack("<H", b[4:6])[0]
              return [b[o:o + s] for s, o in (struct.unpack("<II", b[6 + 16 * i + 8:6 + 16 * i + 16]) for i in range(n))]
          exe = open("rustdesk/EmilliRemote.exe", "rb").read()
          dll = open("rustdesk/EmilliRemoteCore.dll", "rb").read()
          aot = open("rustdesk/data/app.so", "rb").read()
          app_icons = ico_images("flutter/windows/runner/resources/app_icon.ico")
          checks = {
              "app icon images inside EmilliRemote.exe (%d)" % len(app_icons): all(i in exe for i in app_icons),
              "tray icon inside EmilliRemoteCore.dll": open("res/tray-icon.ico", "rb").read() in dll,
              "in-app icon.svg is the Emilli one": open("rustdesk/data/flutter_assets/assets/icon.svg", "rb").read() == open("flutter/assets/icon.svg", "rb").read(),
              "name 'Emilli Remote' inside EmilliRemoteCore.dll": b"Emilli Remote" in dll,
              "name 'Emilli Remote' inside the Flutter app": b"Emilli Remote" in aot,
          }
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Check the program's own name in its file properties (Task Manager, Properties)
        shell: powershell
        run: |
          $bad = 0
          # REMOTE-EASY-3E: every field, the core library too; and no file or folder of the program
          # carries the base software's name (the program folder lists them).
          foreach ($f in @('rustdesk\EmilliRemote.exe', 'rustdesk\EmilliRemoteCore.dll')) {
            $v = (Get-Item $f).VersionInfo
            foreach ($k in @('ProductName', 'FileDescription', 'CompanyName', 'InternalName', 'OriginalFilename', 'LegalCopyright', 'LegalTrademarks', 'Comments')) {
              $val = [string]$v.$k
              $ok = $val -notmatch '(?i)rust\s*desk|purslane'
              Write-Host ("{0} {1} {2}: '{3}'" -f $(if ($ok) { 'PASS' } else { 'FAIL' }), $f, $k, $val)
              if (-not $ok) { $bad++ }
            }
          }
          foreach ($item in @(Get-ChildItem -Path rustdesk -Recurse -Force)) {
            $rel = $item.FullName.Substring((Resolve-Path rustdesk).Path.Length + 1)
            if ($rel -match '(?i)rust\s*desk|purslane') { Write-Host "FAIL file name in the program folder: $rel"; $bad++ }
          }
          Write-Host "files in the program folder: $(@(Get-ChildItem -Path rustdesk -Recurse -File).Count)"
          $exe = [System.IO.File]::ReadAllBytes("$PWD\rustdesk\EmilliRemoteCore.dll")
          $txt = [System.Text.Encoding]::ASCII.GetString($exe)
          $internal = $txt.Contains('EmilliRemote')
          Write-Host ("{0} internal name 'EmilliRemote' inside EmilliRemoteCore.dll" -f $(if ($internal) { 'PASS' } else { 'FAIL' }))
          if (-not $internal) { $bad++ }
          if ($bad -gt 0) { throw "$bad name checks failed" }

      - name: Build self-extracted executable (as upstream)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/EmilliRemote.exe
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe ./out/rustdesk-${{ env.VERSION }}-x86_64.exe
          ls -l ./out
          sha256sum ./out/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Upload the unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emilli-rustdesk-${{ env.VERSION }}-windows-x86_64-unsigned
          path: ./out/rustdesk-${{ env.VERSION }}-x86_64.exe
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
